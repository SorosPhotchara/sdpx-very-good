name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Test backend with PostgreSQL
        run: docker compose -f compose.test.yml up --build --abort-on-container-exit --exit-code-from unit unit

      - name: Clean up backend test containers
        if: always()
        run: docker compose -f compose.test.yml down --volumes

  e2e-tests:
    needs: lint-and-unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Playwright E2E tests
        run: docker compose -f compose.test.yml up --build --abort-on-container-exit --exit-code-from e2e e2e

      - name: Clean up E2E containers
        if: always()
        run: docker compose -f compose.test.yml down --volumes

  deploy-staging:
    needs: [lint-and-unit-test, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Staging
        run: npx vercel --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
