services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paireval
      POSTGRES_USER: paireval
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - paireval_demo_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paireval -d paireval"]
      interval: 3s
      timeout: 3s
      retries: 20

  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: frontend/e2e/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      E2E_DATABASE_URL: postgresql+psycopg://paireval@postgres:5432/paireval
    ipc: host

volumes:
  paireval_demo_data:



