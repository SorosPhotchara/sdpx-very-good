[project]
name = "pairwise-evaluation-backend"
version = "0.1.0"
description = "PairEval classroom pairwise evaluation API"
requires-python = ">=3.12"
authors = [{name = "PairEval Team", email = "team@example.com"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.2.0",
    "google-auth[requests]>=2.0.0,<3.0.0",
    "pydantic[email]>=2.0.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0,<2.0.0"
]

[project.urls]
"Homepage" = "https://example.com"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# `migrations` sits beside `app` at the project root, so flat-layout autodiscovery
# refuses to build. Name the runtime package explicitly.
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
