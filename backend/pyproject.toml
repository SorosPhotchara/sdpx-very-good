[project]
name = "pairwise-evaluation-backend"
version = "0.1.0"
description = "Backend prototype for the PairEval system"
authors = ["PairEval Team <team@example.com>"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6"
]

[project.urls]
"Homepage" = "https://example.com"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
