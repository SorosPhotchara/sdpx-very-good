[pytest]
# Three suites live in this repo and they must all run from one command,
# because AGENTS.md promises agents that `pytest` is the verify step.
#
#   backend/tests    — the PairEval engines (PRD §8/§9), the real harness
#   project/tests    — the WS-03 booking-service warm-up from the lab handout
#   ws-01-before     — the FizzBuzz agent-loop exercise
#
# backend/tests is a package (`tests.*`) while project/tests is reached through
# pythonpath, so their identically-named `factories` modules cannot collide.
pythonpath = backend project/src project/tests ws-01-before
testpaths = backend/tests project/tests ws-01-before
# importlib import mode: both suites have a package literally called `tests`,
# and the default prepend mode would give their two conftest.py files the same
# module name and refuse to load the second.
addopts = -q --strict-markers --import-mode=importlib
