name: paireval-test

services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data # ephemeral: อยู่ใน RAM และหายเมื่อ container หยุด

  unit:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://testuser:testpass@test-db:5432/testdb
      TEST_DATABASE_URL: postgresql+psycopg://testuser:testpass@test-db:5432/testdb
    depends_on:
      test-db:
        condition: service_healthy

  e2e:
    build:
      context: .
      dockerfile: frontend/e2e/Dockerfile
    environment:
      E2E_DATABASE_URL: postgresql+psycopg://testuser:testpass@test-db:5432/testdb
    depends_on:
      test-db:
        condition: service_healthy
    ipc: host # Chromium shared memory
