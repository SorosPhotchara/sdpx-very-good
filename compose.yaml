services:
  app:
    build:
      context: .
      target: build          # dev ใช้ stage ที่มี devDependencies
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://user:pass@db:5432/appdb}
      NODE_ENV: development
      BACKEND_URL: http://backend:8000
    volumes:
      - .:/app               # hot reload สำหรับ dev
      - /app/node_modules    # ไม่ override node_modules ใน image
    # --host 0.0.0.0: Vite ฟังแค่ localhost โดย default ซึ่งเข้าจากนอก container ไม่ได้
    command: npm run dev -- --host 0.0.0.0 --port 3000 --strictPort
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"          # expose สำหรับเรียก /docs ตรง ๆ ตอน dev
    volumes:
      - ./backend:/app       # hot reload สำหรับ dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass  # รหัสสำหรับ local dev เท่านั้น ไม่ใช่ secret จริง
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # expose สำหรับ local database tools

volumes:
  postgres_data:
